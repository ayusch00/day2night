exp_name: cyclegan_day2night

data:
  #day_dir: data/bdd_split/cyclegan/trainA
  #night_dir: data/bdd_split/cyclegan/trainB
  day_dir: data/bdd_kaggle_labels/bdd100k/bdd100k/images/100k/train/trainA
  #night_dir: data/bdd_kaggle_labels/bdd100k/bdd100k/images/100k/train/trainB
  #night_dir: data/fh_nacht/nacht/train
  #day_dir: data/Straßen Bilder/train
  #day_dir: data/cityscapes/leftImg8bit/train
  #night_dir: data/fh_nacht/dämmerung/train
  #day_dir: data/night2day/night_to_day/trainA
  #night_dir: data/night2day/night_to_day/trainB
  night_dir: data/mix_bdd_fh/train
  extensions: ["jpg", "jpeg", "png"]
  sample_limit: 1000

transforms:
  resize: [512, 512]
  random_crop: null
  center_crop: null
  random_flip: false

model:
  generator:
    in_channels: 3
    out_channels: 3
    base_channels: 64
    n_res_blocks: 9
    use_skip: true
    #encoder_checkpoint: latest
    #encoder_checkpoint: latest:seg_cityscapes_*   # optional glob override
    encoder_checkpoint: experiments/seg_20251204_174637/encoder_GE.pth
    freeze_encoder: true
    decoder_res_blocks: 0
  discriminator:
    in_channels: 3
    base_channels: 64
    n_layers: 3
    max_channels: 512
    use_spectral_norm: false

loss:
  lambda_cycle: 10.0
  lambda_identity: 5

sky_loss:
  enabled: False             # Set to true to penalize new lights in sky/trees for day->night.
  grad_weight: 1.0           # Weight for gradient matching inside the sky mask (structure preservation).
  peak_weight: 3.0           # Weight for penalizing bright peaks in the sky mask (prevents hallucinated lights).
  peak_sigma: 3.0            # Gaussian sigma for the peak detector (controls blur strength).
  peak_delta: 0.05           # Allow fake sky to be this much brighter than blurred baseline before penalizing.
  tv_weight: 0.0             # Optional TV smoothing inside the sky mask.
  class_ids: [10, 8]         # e.g. Cityscapes IDs for sky=10, vegetation=8. Adjust to your labels.
  num_classes: 19            # Number of classes in the seg model (needed to build the head).
  seg_checkpoint: "experiments/seg_20251204_174637/segnet_full.pth"       # Path to a full SegNet checkpoint; null/"latest" auto-picks newest segnet_full.pth.
  seg_input_size: null       # Optional (H, W) to resize before seg inference; null = use GAN input size.

optim:
  generator:
    lr: 2.0e-4
    betas: [0.5, 0.999]
  discriminator:
    lr: 1.0e-4
    betas: [0.5, 0.999]

train:
  epochs: 200
  batch_size: 2
  workers: 4
  seed: 42
  lr_decay_start: 100
  amp: true
  image_pool_size: 50

inference:
  brightness_gain: 1.0    # >1.0 hellt Ergebnisse auf, <1.0 dunkelt ab.
  output_gamma: 1.0       # >1.0 hellt (Gamma-Korrektur), <1.0 dunkelt. Wird nach brightness_gain angewandt.

logging:
  out_dir: experiments
  results_dir: results
  save_every: 10
  latest_checkpoint_name: latest.pt
  best_checkpoint_name: best.pt
  keep_epoch_checkpoints: false
  best_metric: g_total
  best_metric_mode: min
  log_interval: 100
