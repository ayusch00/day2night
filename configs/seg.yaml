experiment: cityscapes_unet_resnet_paper
dataset:
  name: cityscapes
  root: data/cityscapes         # <-- passe deinen Pfad an
  split_ratio: [2975, 500]
  classes: 19
  ignore_index: 255

training:
  # Iterationsbasiert (wie im Paper), nicht epoch-basiert
  total_iterations: 80000
  val_every_iterations: 2000
  batch_size: 8                 # im Paper 8 gesamt (z.B. 4 GPUs x 2)
  amp: false                    # Paper nutzte klassisch FP32
  optimizer: sgd
  lr: 2.5e-4
  momentum: 0.9
  weight_decay: 1.0e-4
  lr_policy: poly               # lr * (1 - iter/max_iter)^power
  lr_poly_power: 0.9
  grad_clip: null

image:
  # Paper: alles auf 512x256, Random Crop + Flip
  resize: [512, 256]
  crop: [512, 256]              # RandomCrop
  scale_jitter: null            # kein Multi-Scale Jitter
  horizontal_flip_p: 0.5
  color_jitter: null
  normalize_imagenet: true      # für ResNet-Encoder

model:
  backbone: resnet101           # Paper: ResNet-101 (ImageNet vortrainiert)
  pretrained: imagenet
  decoder: unet                 # S = SE ∘ SD (UNet-artig)
  out_channels: 19
  aux_head: false

checkpointing:
  save_top_k: 3
  keep_last: true
  every_n_val: 1

logging:
  interval_iters: 50
