experiment: cityscapes_unet_resnet
dataset:
  name: cityscapes
  root: data/bdd  # <- set your real Cityscapes root
  split_ratio: [2975, 500]   # train/val
  classes: 19
  ignore_index: 255
training:
  profile: full   # full | lite
  epochs: 120
  batch_size:
    full: 6
    lite: 3
  amp: true
  optimizer: adamw
  lr: 3.0e-4
  weight_decay: 1.0e-4
  lr_schedule: cosine
  warmup_epochs: 5
  grad_clip: 1.0
image:
  resize:
    full: [1024, 512]
    lite: [768, 384]
  crop:
    full: [768, 384]
    lite: [512, 256]
  scale_jitter: [0.5, 2.0]
  horizontal_flip_p: 0.5
  color_jitter: [0.2, 0.2, 0.2, 0.1]
  normalize_imagenet: true
model:
  backbone: resnet34   # or resnet50 if VRAM allows
  pretrained: imagenet
  decoder: unet
  out_channels: 19
  aux_head: false
checkpointing:
  save_top_k: 3
  keep_last: true
  every_n_epochs: 5
logging:
  interval_steps: 50
  val_interval_epochs: 1
