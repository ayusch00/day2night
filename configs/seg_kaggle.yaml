exp_name: "seg_cityscapes_1k"

data:
  root: "data/cityscapes"
  train_images: /kaggle/input/cityscapes-1k/leftImg8bit/train
  train_masks:  /kaggle/input/cityscapes-1k/gtFine/train
  val_images:   "data/cityscapes/leftImg8bit/val"
  val_masks:    "data/cityscapes/gtFine/val"
  num_classes: 19
  ignore_index: 255
  sample_n_train: 1000

train:
  epochs: 200
  batch_size: 8
  seed: 42
  workers: 4

optim:
  name: adam
  lr: 0.0002
  betas: [0.5, 0.999]
  weight_decay: 0.0

scheduler:
  policy: linear_decay_after_warm
  warm_epochs: 100      # keep LR constant for first 100 epochs
  decay_epochs: 100     # then linearly decay to 0 over next 100
  min_lr: 0.0

model:
  base_channels: 64
  n_resblocks: 9

transforms:
  crop: 512
  resize: 256
  hflip: true

logging:
  save_every: 5
  val_every: 1
  out_dir: "experiments"
  results_dir: "results"

artifacts:
  encoder_weights: "encoder_GE.pth"
