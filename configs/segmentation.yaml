# Final encoder pretraining configuration used by the seg_prop run.
# An integer resize preserves the aspect ratio before the random 512 px crop.
exp_name: seg_prop

data:
  dataset: cityscapes
  extensions: [jpg, jpeg, png]
  train_images: data/cityscapes/leftImg8bit/train
  train_masks: data/cityscapes/gtFine/train
  val_images: data/cityscapes/leftImg8bit/val
  val_masks: data/cityscapes/gtFine/val
  num_classes: null
  ignore_index: 255
  use_class_weights: true
  # Upper limit from the final YAML. Cityscapes contains 2,975 train images,
  # therefore the verified final run used the complete official train split.
  sample_n_train: 5000

transforms:
  resize: 572
  crop: 512
  hflip: true

model:
  base_channels: 64
  n_resblocks: 9

train:
  epochs: 300
  batch_size: 8
  workers: 4
  seed: 42
  amp: true

optim:
  name: adam
  lr: 2.0e-4
  betas: [0.5, 0.999]
  weight_decay: 0.0

scheduler:
  policy: linear_decay_after_warm
  warm_epochs: 100
  decay_epochs: 200
  min_lr: 1.0e-6

inference:
  transforms:
    resize: [512, 512]
    crop: null

logging:
  save_every: 1
  val_every: 1
  out_dir: experiments
  results_dir: results

artifacts:
  encoder_weights: encoder_GE.pth
  full_model: segnet_full.pth
