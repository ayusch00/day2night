exp_name: "seg"

data:
  root: "data/"
  dataset: "cityscapes"  # use "cityscapes" "bdd100k" for default mapping logic
  extensions: ["jpg", "jpeg", "png"]
  train_images: "data/cityscapes/leftImg8bit/train"
  train_masks:  "data/cityscapes/gtFine/train"
  val_images:   "data/cityscapes/leftImg8bit/val"
  val_masks:    "data/cityscapes/gtFine/val"
  #train_images:  "data/bdd_kaggle_labels/bdd100k/bdd100k/images/10k/train"
  #train_masks:  "data/bdd_kaggle_labels/bdd100k_seg/bdd100k/seg/labels/train"
  #val_images:   "data/bdd_kaggle_labels/bdd100k/bdd100k/images/10k/val"
  #val_masks:    "data/bdd_kaggle_labels/bdd100k_seg/bdd100k/seg/labels/val"
  num_classes: null  # null = automatisch aus Masken ermitteln
  ignore_index: 255
  use_class_weights: true
  sample_n_train: 5000

train:
  epochs: 200
  batch_size: 8
  seed: 42
  workers: 4
  amp: true
  #global_batch_ref: 4

optim:
  name: adam
  lr: 0.0002
  betas: [0.5, 0.999]
  weight_decay: 0.0

scheduler:
  policy: linear_decay_after_warm
  warm_epochs: 80      # keep LR constant for first 100 epochs
  decay_epochs: 120     # then linearly decay to 0 over next 100
  min_lr: 0.0

model:
  base_channels: 64
  n_resblocks: 9

transforms:
  crop: 512
  resize: 572
  hflip: true

logging:
  save_every: 1
  val_every: 1
  out_dir: "experiments"
  results_dir: "results"

artifacts:
  encoder_weights: "encoder_GE.pth"
  full_model: "segnet_full.pth"   # Optional: full SegNet (Encoder+Decoder) state_dict for downstream masking
