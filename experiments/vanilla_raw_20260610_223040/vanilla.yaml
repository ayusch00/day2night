exp_name: vanilla_raw

data:
  day_dir: data/day2night1000/trainA
  night_dir: data/day2night1000/trainB
  extensions: ["jpg", "jpeg", "png"]
  sample_limit: 1000

transforms:
  resize: [512, 512]
  random_crop: null
  center_crop: null
  random_flip: true

model:
  generator:
    in_channels: 3
    out_channels: 3
    base_channels: 64
    n_res_blocks: 9
    use_skip: true
    encoder_checkpoint: experiments/seg_20251211_162810/encoder_GE.pth
    freeze_encoder: false
    decoder_res_blocks: 0
  discriminator:
    in_channels: 3
    base_channels: 64
    n_layers: 3
    max_channels: 512
    use_spectral_norm: false

loss:
  lambda_cycle: 10.0
  lambda_identity: 5

sky_loss:
  enabled: false
  grad_weight: 1.0
  peak_weight: 3.0
  peak_sigma: 3.0
  peak_delta: 0.05
  tv_weight: 0.0
  class_ids: [10, 8]
  num_classes: 19
  seg_checkpoint: "experiments/seg_20251204_174637/segnet_full.pth"
  seg_input_size: null

semgan:
  use_semgan: false
  lambda_sem: 0.1
  sem_loss_type: "l1_prob"
  apply_on: ["A2B", "B2A"]
  num_classes: 19
  ignore_index: 255
  seg_checkpoint: "./cs2acdc_latest.pth"
  seg_config_json: "./acdc_pretrained.json"
  seg_input_norm: "imagenet"
  seg_inference_size: null
  cache_seg_logits: false

optim:
  generator:
    lr: 2.0e-4
    betas: [0.5, 0.999]
  discriminator:
    lr: 1.0e-4
    betas: [0.5, 0.999]

train:
  epochs: 200
  batch_size: 2
  workers: 4
  seed: 42
  lr_decay_start: 100
  amp: true
  image_pool_size: 50

inference:
  brightness_gain: 1.0
  output_gamma: 1.0

logging:
  out_dir: experiments
  results_dir: results
  save_every: 1
  latest_checkpoint_name: latest.pt
  best_checkpoint_name: best.pt
  keep_epoch_checkpoints: false
  best_metric: g_total
  best_metric_mode: min
  log_interval: 100
